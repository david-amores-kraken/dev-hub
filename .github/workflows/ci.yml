name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # pyproject.toml points at folders in ~/.claude, which only exist on my machine: the pr-brief
      # package and a shared lib folder. Put a small stand-in package and an empty folder there.
      - name: Add the ~/.claude stand-ins
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../.claude/skills" "$GITHUB_WORKSPACE/../../.claude/lib"
          cp -r .github/ci/pr-brief "$GITHUB_WORKSPACE/../../.claude/skills/pr-brief"

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest
